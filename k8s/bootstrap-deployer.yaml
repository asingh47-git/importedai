apiVersion: v1
kind: Namespace
metadata:
  name: legallens
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions-deployer
  namespace: legallens
---
apiVersion: v1
kind: Secret
metadata:
  name: github-actions-deployer-token
  namespace: legallens
  annotations:
    kubernetes.io/service-account.name: github-actions-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: legallens-deployer
  namespace: legallens
rules:
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-deployer
  namespace: legallens
subjects:
  - kind: ServiceAccount
    name: github-actions-deployer
    namespace: legallens
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: legallens-deployer